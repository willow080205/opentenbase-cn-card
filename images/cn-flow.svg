<svg viewBox="0 0 1160 700" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CN 协调节点数据流图">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
        </marker>
        <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
        </marker>
        <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
        </marker>
        <marker id="arPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
        </marker>
      </defs>

      <!-- ===== 客户端接入 ===== -->
      <text x="120" y="18" font-size="12" fill="#64748b">客户端接入（Clients）—— 均通过标准 PostgreSQL 协议连接</text>
      <rect x="120" y="28" width="200" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="220" y="61" font-size="14" fill="#1e293b" text-anchor="middle">psql / 业务应用</text>
      <rect x="350" y="28" width="190" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="445" y="61" font-size="14" fill="#1e293b" text-anchor="middle">JDBC / DBeaver</text>

      <!-- SQL 下行 / 结果上行 -->
      <line x1="445" y1="86" x2="445" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#arBlue)"/>
      <text x="457" y="106" font-size="12" fill="#2563eb">SQL 请求</text>
      <line x1="520" y1="134" x2="520" y2="88" stroke="#2563eb" stroke-width="2" marker-end="url(#arBlue)" stroke-dasharray="5,4"/>
      <text x="532" y="128" font-size="12" fill="#2563eb">结果汇总返回</text>

      <!-- ===== CN ===== -->
      <rect x="70" y="140" width="620" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="90" y="168" font-size="15" font-weight="bold" fill="#1d4ed8">CN（Coordinator Node）· 协调节点集群</text>
      <text x="90" y="188" font-size="11" fill="#64748b">src/backend/pgxc/</text>
      <rect x="455" y="150" width="222" height="28" rx="14" fill="#fef2f2" stroke="#dc2626"/>
      <text x="566" y="169" font-size="12" fill="#dc2626" text-anchor="middle">只存元数据，不存业务数据</text>

      <!-- CN 三步 -->
      <rect x="90" y="205" width="185" height="105" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="182" y="238" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① SQL 解析与重写</text>
      <text x="182" y="260" font-size="12" fill="#475569" text-anchor="middle">Parser</text>
      <text x="182" y="284" font-size="11" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace">gram.y · RewriteHandler</text>

      <line x1="277" y1="257" x2="287" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

      <rect x="290" y="205" width="185" height="105" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="382" y="238" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 分布式查询规划</text>
      <text x="382" y="260" font-size="12" fill="#475569" text-anchor="middle">Planner · 分片路由</text>
      <text x="382" y="284" font-size="11" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace">pgxcplanner.c</text>

      <line x1="477" y1="257" x2="487" y2="257" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

      <rect x="490" y="205" width="182" height="105" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="581" y="238" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③ 执行与下推</text>
      <text x="581" y="260" font-size="12" fill="#475569" text-anchor="middle">Executor</text>
      <text x="581" y="284" font-size="11" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace">execRemote.c · squeue.c</text>

      <!-- CN 第 4 模块 -->
      <rect x="90" y="325" width="582" height="60" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="4,3"/>
      <text x="110" y="350" font-size="13" font-weight="bold" fill="#1e3a8a">④ 连接池与 GTM 客户端（poolmgr.c · gtm.c）</text>
      <text x="110" y="372" font-size="12" fill="#475569">代表 CN 向 GTM 申请全局事务号、获取全局一致性快照</text>

      <!-- ===== GTM ===== -->
      <rect x="790" y="140" width="300" height="170" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="810" y="168" font-size="15" font-weight="bold" fill="#6d28d9">GTM（全局事务管理器）</text>
      <text x="810" y="186" font-size="11" fill="#64748b">src/gtm/</text>
      <text x="810" y="214" font-size="13" font-weight="bold" fill="#4c1d95">全局事务号与快照中心</text>
      <text x="810" y="236" font-size="12" fill="#475569">64-bit GXID（gtm_txn.c）</text>
      <text x="810" y="256" font-size="12" fill="#475569">全局一致性快照（MVCC）</text>
      <text x="810" y="280" font-size="11" fill="#64748b">GTM-Proxy（连接复用 / 批处理代理）</text>
      <text x="810" y="297" font-size="11" fill="#64748b">减少 CN 与 GTM 主节点的高并发直连</text>

      <!-- CN <-> GTM 双向 -->
      <line x1="692" y1="210" x2="784" y2="210" stroke="#7c3aed" stroke-width="2" marker-end="url(#arPurple)"/>
      <text x="738" y="200" font-size="11" fill="#7c3aed" text-anchor="middle">申请 GXID</text>
      <line x1="790" y1="248" x2="698" y2="248" stroke="#7c3aed" stroke-width="2" marker-end="url(#arPurple)" stroke-dasharray="5,4"/>
      <text x="738" y="266" font-size="11" fill="#7c3aed" text-anchor="middle">返回全局快照</text>

      <!-- CN -> DN -->
      <line x1="235" y1="412" x2="235" y2="484" stroke="#059669" stroke-width="2" marker-end="url(#arGreen)"/>
      <line x1="585" y1="412" x2="585" y2="484" stroke="#059669" stroke-width="2" marker-end="url(#arGreen)"/>
      <line x1="932" y1="412" x2="932" y2="484" stroke="#059669" stroke-width="2" marker-end="url(#arGreen)"/>
      <text x="610" y="452" font-size="12" fill="#047857">下发算子 · 收回各分片结果</text>

      <!-- ===== DN ===== -->
      <rect x="55" y="470" width="1050" height="215" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="75" y="496" font-size="14" font-weight="bold" fill="#047857">DN（DataNode）· 数据存储与执行节点集群 —— 数据按分片（Shard）存放在这里，并在本地执行</text>

      <rect x="75" y="510" width="320" height="155" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="95" y="538" font-size="14" font-weight="bold" fill="#065f46">DN 1（Master / Standby）</text>
      <text x="95" y="564" font-size="12" fill="#334155">分片 Shard 0 – 4095</text>
      <text x="95" y="586" font-size="12" fill="#334155">本地 PG 内核 · 本地 WAL</text>
      <text x="95" y="608" font-size="12" fill="#334155">MVCC 可见性</text>

      <rect x="425" y="510" width="320" height="155" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="445" y="538" font-size="14" font-weight="bold" fill="#065f46">DN 2（Master / Standby）</text>
      <text x="445" y="564" font-size="12" fill="#334155">分片 Shard 4096 – 8191</text>
      <text x="445" y="586" font-size="12" fill="#334155">算子并行下推 · 索引加速</text>
      <text x="445" y="608" font-size="12" fill="#334155">向量近邻检索</text>

      <rect x="775" y="510" width="315" height="155" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="795" y="538" font-size="14" font-weight="bold" fill="#065f46">DN N（弹性水平扩展）</text>
      <text x="795" y="564" font-size="12" fill="#334155">扩容时数据平滑迁移</text>
      <text x="795" y="586" font-size="12" fill="#334155">多副本流复制 · 故障自动切换</text>
    </svg>